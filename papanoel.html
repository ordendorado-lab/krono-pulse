:root{--g:#c9a868;--gl:#ecdcae;--gd:#8a6a32;--bg:#0b0a08;--card:#14110d;--line:#2c261c;--tx:#efe6d2;--mu:#a69a82;--red:#9e1b2a;--red2:#6d0f1b;--em:#0e3a2c;--em2:#082419;--pap:#f4e9d0;--ink:#3a2414}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:ODSans,system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;background:radial-gradient(120% 55% at 50% -8%,#2b2015 0%,#120e0a 45%,var(--bg) 70%) fixed;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
#snow{position:fixed;inset:0;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:540px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(70px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;min-height:34px}
.brand{letter-spacing:.42em;font-size:10.5px;color:var(--g)}
.ib{background:none;border:1px solid var(--line);border-radius:20px;padding:5px 11px;font-size:14px;color:var(--gl);cursor:pointer}
.view{display:none;animation:vIn .45s ease}
.view.on{display:block}
@keyframes vIn{from{opacity:0;transform:translateY(8px)}}
h1{font-family:ODSerif,serif;font-weight:400;text-align:center;font-size:40px;line-height:1.05;margin:16px 0 6px;background:linear-gradient(180deg,#fff3cf,var(--g) 60%,var(--gd));-webkit-background-clip:text;background-clip:text;color:transparent}
h1 i{font-family:ODScript,serif;font-style:normal;font-size:1.15em;display:block}
h2{font-family:ODSerif,serif;font-weight:400;font-size:28px;margin:10px 0 4px;color:var(--gl);text-align:center}
.sub{text-align:center;color:var(--mu);font-size:14px;margin:0 auto 14px;max-width:420px;line-height:1.45}
.card{background:linear-gradient(180deg,rgba(28,23,17,.94),rgba(17,14,11,.94));border:1px solid var(--line);border-radius:20px;padding:16px;margin:14px 0;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.st{display:flex;align-items:center;gap:10px;font-family:ODSerif,serif;font-size:21px;color:var(--gl);margin:0 0 10px}
.st b{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:linear-gradient(145deg,var(--gl),var(--g));color:#1a140c;font-family:ODSans;font-size:14px;flex:0 0 auto}
label{display:block;font-size:11px;letter-spacing:.18em;color:var(--g);text-transform:uppercase;margin:14px 0 6px}
input,textarea,select{width:100%;background:#0d0b09;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;outline:none}
select{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--g) 50%),linear-gradient(135deg,var(--g) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
input:focus,textarea:focus,select:focus{border-color:var(--g)}
textarea{min-height:110px;resize:vertical;line-height:1.45}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1.4fr .8fr;gap:10px}
.hint{font-size:12.5px;color:var(--mu);margin-top:6px;line-height:1.4}
.btn{display:block;width:100%;text-align:center;border:0;border-radius:16px;padding:15px;font-size:16px;font-weight:500;cursor:pointer;text-decoration:none;margin-top:10px}
.btn:disabled{opacity:.5}
.gold{background:linear-gradient(135deg,#f6e4b0,var(--g) 50%,#a9853f);color:#1a140c;box-shadow:0 8px 24px rgba(201,168,104,.25)}
.redb{background:linear-gradient(135deg,#c23345,var(--red) 55%,var(--red2));color:#fff3dc;box-shadow:0 8px 24px rgba(158,27,42,.3)}
.ghost{background:transparent;border:1px solid var(--line);color:var(--gl)}
.sm{padding:10px 14px;font-size:14px;border-radius:12px;width:auto;display:inline-block;margin:0}
.back{background:none;border:0;color:var(--g);font-size:15px;padding:8px 0;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:#0f0d0a;border-radius:20px;padding:8px 12px;font-size:14px;cursor:pointer;color:var(--tx)}
.chip.on{border-color:var(--g);background:linear-gradient(180deg,#2c2316,#16110c);box-shadow:inset 0 0 0 1px var(--g);color:var(--gl)}
.foot{text-align:center;color:#5d5446;font-size:10.5px;letter-spacing:.3em;margin-top:26px}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--red);color:#fff;font-size:12px;font-weight:500}
/* countdown */
.cd{display:flex;justify-content:center;gap:8px;margin:12px 0 4px}
.cd div{min-width:66px;text-align:center;border:1px solid var(--line);border-radius:14px;padding:9px 4px;background:rgba(15,13,10,.85)}
.cd b{display:block;font-family:ODSerif,serif;font-weight:400;font-size:30px;color:var(--gl);font-variant-numeric:tabular-nums;line-height:1}
.cd small{font-size:10px;letter-spacing:.16em;color:var(--mu);text-transform:uppercase}
.cdt{text-align:center;color:var(--g);font-size:12px;letter-spacing:.2em;text-transform:uppercase;margin-top:8px}
/* kids */
.kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-top:16px}
.kid{border:1px solid var(--line);border-radius:20px;padding:16px 8px;text-align:center;cursor:pointer;background:linear-gradient(180deg,rgba(30,24,16,.95),rgba(15,12,9,.95));position:relative}
.kid:active{transform:scale(.98)}
.av{width:82px;height:82px;border-radius:50%;margin:0 auto 10px;border:2px solid var(--g);background:radial-gradient(circle at 35% 30%,#2f6a52,var(--em) 60%,var(--em2)) center/cover;display:grid;place-items:center;font-family:ODSerif,serif;font-size:36px;color:var(--gl);box-shadow:0 0 0 4px rgba(201,168,104,.12),0 8px 20px rgba(0,0,0,.4)}
.kid .n{font-family:ODSerif,serif;font-size:21px;color:var(--gl)}
.kid .badge{position:absolute;top:10px;right:10px}
.plock{display:block;margin:22px auto 0;background:none;border:0;color:var(--mu);font-size:13px;letter-spacing:.08em;cursor:pointer}
/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.tile{position:relative;border:1px solid var(--line);border-radius:20px;padding:18px 12px 16px;text-align:center;cursor:pointer;background:linear-gradient(180deg,rgba(32,25,17,.95),rgba(15,12,9,.95));min-height:132px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tile:active{transform:scale(.98)}
.tile.wide{grid-column:1/-1;min-height:96px;flex-direction:row;gap:14px;justify-content:flex-start;padding:16px 18px;text-align:left}
.tile .ic{font-size:34px;line-height:1;margin-bottom:8px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}
.tile.wide .ic{margin:0;font-size:38px}
.tile .tt{font-family:ODSerif,serif;font-size:19px;color:var(--gl);line-height:1.15}
.tile .ts{font-size:12px;color:var(--mu);margin-top:4px}
.tile .badge{position:absolute;top:10px;right:10px}
.tile.hl{border-color:#6a5630;box-shadow:inset 0 0 0 1px rgba(201,168,104,.35),0 0 30px rgba(201,168,104,.12)}
/* write */
.paperw{background:var(--pap) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3'/><feColorMatrix values='0 0 0 0 .45 0 0 0 0 .32 0 0 0 0 .16 0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");color:var(--ink);border-radius:6px;padding:22px 20px 18px;box-shadow:0 18px 40px rgba(0,0,0,.5),inset 0 0 60px rgba(150,110,50,.25);position:relative}
.paperw .dear{font-family:ODScript,serif;font-size:30px;margin-bottom:6px}
.paperw textarea{background:transparent;border:0;border-radius:0;color:var(--ink);font-family:ODScript,serif;font-size:24px;line-height:38px;min-height:190px;padding:0;background-image:repeating-linear-gradient(transparent 0 37px,rgba(120,80,40,.22) 37px 38px)}
.paperw textarea::placeholder{color:rgba(90,60,30,.45)}
.paperw .wl{font-family:ODSerif,serif;font-style:italic;font-size:17px;margin-top:10px;color:#5b3a1d}
.wish{display:flex;align-items:center;gap:8px;margin-top:6px}
.wish input{background:rgba(255,255,255,.35);border:1px solid rgba(120,80,40,.3);color:var(--ink);font-family:ODSerif,serif;font-size:18px;padding:9px 12px}
.wish button{background:none;border:0;color:#8b5b2b;font-size:20px;padding:4px 8px}
.addw{background:none;border:1px dashed rgba(120,80,40,.45);color:#7a4e24;border-radius:12px;padding:9px;width:100%;margin-top:8px;font-family:ODSerif,serif;font-size:16px}
.mic{display:flex;align-items:center;gap:12px;margin-top:4px}
.micb{width:74px;height:74px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#d8455a,var(--red) 55%,var(--red2));color:#fff;font-size:30px;box-shadow:0 0 0 5px rgba(158,27,42,.18),0 10px 24px rgba(0,0,0,.45);flex:0 0 auto;cursor:pointer}
.micb.rec{animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 14px rgba(158,27,42,.05),0 10px 24px rgba(0,0,0,.45)}}
.vt{font-variant-numeric:tabular-nums;color:var(--gl);font-size:20px}
.mict{font-size:14px;color:var(--mu);line-height:1.35}
/* envelope */
.stage{position:relative;height:440px;perspective:1100px;display:grid;place-items:center;margin-top:6px}
.env{position:relative;width:310px;height:206px;transform-style:preserve-3d;transition:transform 1.4s cubic-bezier(.55,0,.35,1),opacity 1.2s}
.env .bk,.env .fr{position:absolute;inset:0;border-radius:6px}
.env .bk{background:linear-gradient(160deg,#efe2c3,#dcc79d);box-shadow:0 22px 50px rgba(0,0,0,.55)}
.env .fr{background:linear-gradient(160deg,#f2e6c9,#ddc9a0);clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%);z-index:3;border:1px solid rgba(138,106,50,.35)}
.env .fr:after{content:"";position:absolute;inset:7px;border:1px solid rgba(160,120,50,.5);border-radius:3px;clip-path:inherit}
.env .fl{position:absolute;left:0;right:0;top:0;height:62%;background:linear-gradient(180deg,#e6d4ac,#d4bd8d);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .9s ease .15s,z-index 0s .6s;z-index:4;filter:drop-shadow(0 3px 3px rgba(0,0,0,.15))}
.env.open .fl{transform:rotateX(180deg);z-index:1}
.env .to{position:absolute;left:0;right:0;bottom:22px;text-align:center;z-index:5;color:#5a3a1a;font-family:ODScript,serif;font-size:25px}
.env .pm{position:absolute;right:16px;bottom:56px;width:62px;height:62px;border-radius:50%;border:2px solid rgba(110,40,40,.55);z-index:5;display:grid;place-items:center;text-align:center;font-size:7.5px;letter-spacing:.12em;color:rgba(110,40,40,.75);transform:rotate(-14deg);line-height:1.3}
.env .stamp{position:absolute;left:16px;bottom:52px;width:52px;height:62px;z-index:5;background:#0e3a2c;border:3px dotted #f2e6c9;outline:1px solid rgba(110,80,30,.4);display:grid;place-items:center;color:var(--gl);font-family:ODSerif,serif;font-size:24px}
.seal{position:absolute;left:50%;top:56%;width:74px;height:74px;margin:-37px 0 0 -37px;z-index:6;cursor:pointer;transition:transform .5s,opacity .5s}
.seal i{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 36% 30%,#d6475a,#9e1b2a 50%,#5e0c17 88%);box-shadow:0 5px 12px rgba(0,0,0,.45),inset 0 -4px 8px rgba(0,0,0,.35),inset 0 3px 6px rgba(255,180,180,.25);display:grid;place-items:center;font-family:ODSerif,serif;font-style:normal;color:rgba(255,215,190,.85);font-size:30px;text-shadow:0 -1px 0 rgba(0,0,0,.4),0 1px 0 rgba(255,200,200,.2)}
.seal i:before{content:"";position:absolute;inset:8px;border-radius:50%;border:1.5px solid rgba(255,200,180,.35)}
.seal.pulse{animation:sp 1.6s infinite}
@keyframes sp{50%{transform:scale(1.07)}}
.seal.brk{transform:scale(1.25) rotate(18deg);opacity:0}
.taph{text-align:center;color:var(--gl);font-size:15px;margin-top:2px;min-height:22px}
.fly{animation:fly 1.9s cubic-bezier(.5,0,.75,0) forwards}
@keyframes fly{0%{transform:translateY(0) rotate(0)}25%{transform:translateY(16px) rotate(-3deg) scale(.96)}100%{transform:translateY(-760px) translateX(120px) rotate(-18deg) scale(.35);opacity:0}}
.spark{position:absolute;width:6px;height:6px;border-radius:50%;background:#ffe9a8;box-shadow:0 0 10px 3px rgba(255,220,140,.7);pointer-events:none;animation:spk 1.4s ease-out forwards}
@keyframes spk{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.lin{position:absolute;left:18px;right:18px;top:16px;bottom:30%;background:var(--pap);border-radius:3px;z-index:2;transition:transform 1s ease .7s;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.env.open .lin{transform:translateY(-70px)}
/* letter */
.letter{position:relative;margin:8px auto 0;max-width:520px;background:var(--pap) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3'/><feColorMatrix values='0 0 0 0 .45 0 0 0 0 .32 0 0 0 0 .16 0 0 0 .1 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");color:var(--ink);border-radius:4px;padding:34px 26px 30px;box-shadow:0 24px 60px rgba(0,0,0,.6),inset 0 0 80px rgba(150,105,45,.3);animation:unf 1s cubic-bezier(.2,.8,.2,1);transform-origin:top;overflow:hidden}
@keyframes unf{from{transform:scaleY(.15) translateY(40px);opacity:0}}
.letter:before{content:"";position:absolute;inset:10px;border:1px solid rgba(150,110,50,.45);pointer-events:none}
.letter:after{content:"";position:absolute;inset:14px;border:1px solid rgba(150,110,50,.22);pointer-events:none}
.lh{text-align:center;font-family:ODSerif,serif;letter-spacing:.32em;font-size:10.5px;color:#8a5a2a;margin-bottom:2px}
.lh2{text-align:center;font-family:ODSerif,serif;font-style:italic;color:#9b6b35;font-size:13px;margin-bottom:16px}
.orn{display:block;margin:0 auto 14px;width:150px;height:14px}
.ltx{font-family:ODScript,serif;font-size:23px;line-height:1.5;white-space:pre-wrap;min-height:200px}
.ltx .q{display:inline-block;width:0;height:0;position:relative}
.ltx .q:after{content:"";position:absolute;left:2px;top:-30px;width:26px;height:34px;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 34'><path d='M2 33 L9 21 C6 12 12 3 25 1 C22 10 18 19 9 22 Z' fill='%23b08a3e' stroke='%236b4e1d' stroke-width='.8'/><path d='M2 33 L18 6' stroke='%236b4e1d' stroke-width='.7'/></svg>") no-repeat;animation:qw .35s infinite alternate}
@keyframes qw{to{transform:translate(1px,-2px) rotate(4deg)}}
.sig{margin-top:14px;text-align:right;opacity:0;transition:opacity 1.2s}
.sig.on{opacity:1}
.sig .w{font-family:ODScript,serif;font-size:21px}
.sig .nm{font-family:ODScript,serif;font-size:46px;line-height:1;color:#5a1414}
.sig svg{width:190px;height:22px;display:block;margin-left:auto}
.sig path{stroke-dasharray:400;stroke-dashoffset:400}
.sig.on path{transition:stroke-dashoffset 1.6s ease .3s;stroke-dashoffset:0}
.wseal{position:absolute;left:22px;bottom:22px;width:78px;height:78px;border-radius:50%;background:radial-gradient(circle at 36% 30%,#d6475a,#9e1b2a 50%,#5e0c17 88%);box-shadow:0 5px 12px rgba(0,0,0,.35),inset 0 -4px 8px rgba(0,0,0,.35);display:grid;place-items:center;text-align:center;color:rgba(255,215,190,.88);font-family:ODSerif,serif;font-size:7.5px;letter-spacing:.14em;line-height:1.5;opacity:0;transform:scale(1.6) rotate(-20deg);transition:all .5s cubic-bezier(.3,1.6,.5,1)}
.wseal b{display:block;font-size:22px;font-weight:400;letter-spacing:0;line-height:1}
.wseal.on{opacity:1;transform:scale(1) rotate(-10deg)}
.wm{position:absolute;inset:0;pointer-events:none;display:grid;place-items:center;z-index:3}
.wm span{transform:rotate(-28deg);font-family:ODSans;font-weight:500;font-size:44px;letter-spacing:.3em;color:rgba(158,27,42,.16);white-space:nowrap}
.ldate{font-family:ODSerif,serif;font-style:italic;font-size:14px;color:#8a5a2a;text-align:right;margin-bottom:10px}
/* list scroll */
.scroll{position:relative;margin:16px auto 0;max-width:500px;background:var(--pap);color:var(--ink);padding:30px 24px 26px;border-radius:4px;box-shadow:0 20px 50px rgba(0,0,0,.55),inset 0 0 70px rgba(150,105,45,.3)}
.scroll:before,.scroll:after{content:"";position:absolute;left:-8px;right:-8px;height:18px;border-radius:9px;background:linear-gradient(180deg,#d9c193,#b2945b 60%,#8a6c38);box-shadow:0 4px 8px rgba(0,0,0,.35)}
.scroll:before{top:-9px}.scroll:after{bottom:-9px}
.scroll h3{font-family:ODSerif,serif;font-weight:400;text-align:center;font-size:26px;margin:4px 0 0;color:#5a1414}
.scroll .ss{text-align:center;font-family:ODSerif,serif;font-style:italic;font-size:14px;color:#8a5a2a;margin-bottom:14px}
.gl{list-style:none;padding:0;margin:0}
.gl li{display:flex;align-items:center;justify-content:space-between;border-bottom:1px dotted rgba(120,80,40,.35);padding:9px 2px;font-family:ODScript,serif;font-size:23px}
.gl li.me{background:linear-gradient(90deg,transparent,rgba(201,168,104,.28),transparent);font-size:27px}
.gl li i{font-style:normal;font-family:ODSans;font-size:12px;color:#2c6a4a;letter-spacing:.08em}
.okst{margin:16px auto 4px;width:150px;height:150px;border-radius:50%;border:3px double #2c6a4a;color:#2c6a4a;display:grid;place-items:center;text-align:center;font-family:ODSerif,serif;transform:rotate(-12deg);font-size:12px;letter-spacing:.16em;line-height:1.5;animation:stp .6s cubic-bezier(.3,1.6,.5,1)}
.okst b{display:block;font-size:22px;letter-spacing:.06em;font-weight:400}
@keyframes stp{from{transform:scale(2) rotate(-30deg);opacity:0}}
.meter{margin-top:6px;height:14px;border-radius:8px;background:rgba(120,80,40,.15);overflow:hidden;border:1px solid rgba(120,80,40,.25)}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#c9a868,#f3d98d,#c9a868);border-radius:8px;transition:width 1.6s ease}
.lvl{display:flex;justify-content:space-between;font-family:ODSerif,serif;font-size:14px;color:#6b4520;margin-top:14px}
.deeds{margin-top:12px;font-family:ODSerif,serif;font-size:16px;color:#4a2e16}
.deeds div{padding:6px 0;border-bottom:1px dotted rgba(120,80,40,.25)}
.deeds small{color:#9b6b35;font-style:italic}
/* passport */
.pass{margin:12px auto 0;max-width:460px;border-radius:16px;overflow:hidden;box-shadow:0 22px 50px rgba(0,0,0,.6);background:#f3ead4;color:#2b1d10}
.pass .ph{background:linear-gradient(135deg,#124a37,var(--em) 50%,#062016);color:var(--gl);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--g)}
.pass .ph b{font-family:ODSerif,serif;font-weight:400;font-size:19px;letter-spacing:.12em}
.pass .ph small{font-size:9.5px;letter-spacing:.25em;opacity:.85}
.pass .pb{display:grid;grid-template-columns:112px 1fr;gap:14px;padding:16px 18px 12px;position:relative}
.pass .pp{width:112px;height:140px;border-radius:8px;background:#ddd0b0 center/cover;border:1px solid rgba(120,80,40,.4);display:grid;place-items:center;font-family:ODSerif,serif;font-size:50px;color:#8a6a32}
.pass .f{font-size:9px;letter-spacing:.2em;color:#8a6a32;text-transform:uppercase;margin-top:6px}
.pass .f:first-child{margin-top:0}
.pass .v{font-family:ODSerif,serif;font-size:18px;color:#2b1d10}
.pass .mrz{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;letter-spacing:.12em;padding:8px 18px 14px;color:#4a3a28;word-break:break-all;border-top:1px dashed rgba(120,80,40,.35)}
.pass .ps{position:absolute;right:14px;bottom:-38px;width:80px;height:80px;z-index:2;background:rgba(243,234,212,.35);border-radius:50%;border:2px solid rgba(158,27,42,.6);color:rgba(158,27,42,.75);display:grid;place-items:center;text-align:center;font-size:7px;letter-spacing:.14em;transform:rotate(-16deg);line-height:1.45;font-family:ODSans}
.pass .ps b{display:block;font-size:12px;letter-spacing:.1em;font-weight:500}
.pass .sg{font-family:ODScript,serif;font-size:24px;color:#5a1414;line-height:1}
/* tracker */
.sky{position:relative;height:290px;border-radius:20px;overflow:hidden;background:linear-gradient(180deg,#050813 0%,#0b1430 55%,#1a2140 80%,#2a2238 100%);border:1px solid #1e2440;margin-top:12px}
.sky .moon{position:absolute;right:28px;top:24px;width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 40% 38%,#fffbe8,#efe2b8 60%,#cdbb85);box-shadow:0 0 40px 10px rgba(255,240,190,.18)}
.sky .hills{position:absolute;left:-10%;right:-10%;bottom:-60px;height:100px;z-index:2;border-radius:50% 50% 0 0;background:linear-gradient(180deg,#e8eef8,#b8c3d8);box-shadow:0 -6px 30px rgba(220,230,255,.25)}
.sky .town{position:absolute;left:0;right:0;bottom:22px;height:60px;z-index:1}
.sky .sl{position:absolute;width:12px;height:12px;border-radius:50%;background:#fff6d0;box-shadow:0 0 14px 6px rgba(255,220,130,.85),0 0 40px 14px rgba(255,200,90,.35);transition:left 1s linear,top 1s linear}
.sky .trail{position:absolute;height:2px;transform-origin:right center;background:linear-gradient(90deg,transparent,rgba(255,225,150,.75));border-radius:2px}
.sky .lbl{position:absolute;font-size:11px;letter-spacing:.14em;color:#ffe9b0;white-space:nowrap;text-shadow:0 0 6px rgba(0,0,0,.8);transform:translate(-50%,-26px)}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat div{border:1px solid var(--line);border-radius:14px;padding:12px;background:rgba(15,13,10,.85)}
.stat small{display:block;font-size:10px;letter-spacing:.16em;color:var(--mu);text-transform:uppercase}
.stat b{font-family:ODSerif,serif;font-weight:400;font-size:21px;color:var(--gl)}
.prog{margin:8px 0 2px}
.prog .pl{display:flex;justify-content:space-between;font-size:14px;color:var(--gl);margin-top:12px}
.prog .bar{height:8px;border-radius:5px;background:#1d1912;overflow:hidden;margin-top:6px}
.prog .bar i{display:block;height:100%;background:linear-gradient(90deg,#8a6a32,#f3d98d);border-radius:5px;transition:width 1.4s ease}
.big{font-family:ODSerif,serif;font-size:24px;color:var(--gl);text-align:center;line-height:1.3;margin:14px 0 2px}
.route{margin-top:10px;font-size:13px;color:var(--mu);max-height:180px;overflow:auto}
.route div{display:flex;justify-content:space-between;padding:6px 2px;border-bottom:1px solid var(--line)}
.route div.d{color:#9fd39a}
.route div.n{color:var(--gl)}
/* parent */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:10px -2px 0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:#0f0d0a;border-radius:20px;padding:8px 14px;font-size:14px;cursor:pointer;color:var(--mu);white-space:nowrap}
.tab.on{color:#1a140c;background:linear-gradient(135deg,#f6e4b0,var(--g));border-color:var(--g)}
.it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.it:last-child{border:0}
.it .n{font-size:15.5px;color:var(--tx)}
.it .m{font-size:12.5px;color:var(--mu);margin-top:2px}
.it .x{background:none;border:0;color:var(--mu);font-size:18px;padding:6px;cursor:pointer}
.empty{color:var(--mu);font-size:14px;text-align:center;padding:10px;line-height:1.5}
.lt{background:#0d0b09;border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:8px;font-size:15px;line-height:1.5;white-space:pre-wrap}
.lt .wl{color:var(--gl);margin-top:6px}
audio{width:100%;margin-top:8px;height:40px}
.trial{border-color:#5b4a2a;background:linear-gradient(180deg,rgba(42,33,20,.95),rgba(20,16,11,.95))}
.trial p{margin:0 0 10px;color:var(--mu);font-size:14px;line-height:1.45}
.code{display:flex;gap:8px}.code input{text-transform:uppercase;letter-spacing:.15em}
.code .btn{margin:0;width:auto;padding:0 18px}
.okc{text-align:center;color:#9fd39a;font-size:14px}
.pin{display:flex;justify-content:center;gap:12px;margin:18px 0}
.pin i{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--g)}
.pin i.f{background:var(--g)}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:12px;justify-content:center}
.pad button{height:64px;border-radius:50%;border:1px solid var(--line);background:#120f0b;font-size:24px;color:var(--gl);cursor:pointer}
.pad button:active{background:#2a2216}
.pad .e{border:0;background:none;font-size:15px;color:var(--mu)}
.sw{display:flex;align-items:center;gap:10px;font-size:15px;margin-top:12px;text-transform:none;letter-spacing:0;color:var(--tx)}
.sw input{width:22px;height:22px;accent-color:var(--g)}
.prev{background:#0d0b09;border:1px solid var(--g);border-radius:14px;padding:14px;margin-top:10px}
.prev textarea{min-height:260px;font-size:15px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.66);display:none;align-items:flex-end;justify-content:center;z-index:50;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.ov.on{display:flex}
.sheet{width:100%;max-width:540px;max-height:88vh;overflow:auto;background:#15120e;border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom));animation:shIn .3s ease}
@keyframes shIn{from{transform:translateY(40px);opacity:0}}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sh h3{margin:0;font-family:ODSerif,serif;font-weight:400;font-size:22px;color:var(--gl)}
.sh button{background:none;border:0;color:var(--mu);font-size:15px;cursor:pointer}
.steps{margin:0;padding-left:20px;line-height:1.6;color:var(--tx);font-size:15px}
.steps b{color:var(--gl)}
#toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#221c13;border:1px solid var(--g);color:var(--gl);padding:11px 18px;border-radius:24px;font-size:14px;opacity:0;transition:all .3s;z-index:60;max-width:90vw;text-align:center;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.mailit{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:16px;margin-top:10px;cursor:pointer;background:rgba(15,13,10,.9)}
.mailit .e{width:62px;height:42px;border-radius:4px;background:linear-gradient(160deg,#f2e6c9,#d8c398);position:relative;flex:0 0 auto}
.mailit .e:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#e2cfa5,#cfb784);clip-path:polygon(0 0,100% 0,50% 60%)}
.mailit .e:after{content:"";position:absolute;left:50%;top:48%;width:16px;height:16px;margin:-8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d6475a,#8e1626)}
.mailit.new{border-color:#6a5630;box-shadow:0 0 24px rgba(201,168,104,.15)}
.mailit .n{font-family:ODSerif,serif;font-size:18px;color:var(--gl)}
.mailit .m{font-size:12.5px;color:var(--mu)}
.mailit.wait{cursor:default;opacity:.85}
.mailit.wait .e{filter:grayscale(.3) brightness(.8)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
@media (max-width:360px){h1{font-size:34px}.cd div{min-width:58px}.cd b{font-size:26px}.env{transform:scale(.9)}}
/* ===== modo niños: Navidad animada ===== */
body.kidmode{background:radial-gradient(120% 50% at 50% -5%,#3a1c16 0%,#1a0f0c 40%,#0b0a08 72%) fixed}
.lights{position:fixed;top:env(safe-area-inset-top);left:0;right:0;height:26px;display:none;justify-content:space-between;padding:0 6px;z-index:40;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.35),transparent)}
.lights:before{content:"";position:absolute;left:0;right:0;top:4px;height:12px;border-bottom:1.5px solid #2c3a26;border-radius:0 0 50% 50%/0 0 100% 100%}
.lights i{position:relative;top:9px;width:9px;height:14px;border-radius:50% 50% 50% 50%/40% 40% 60% 60%;background:var(--c);box-shadow:0 0 10px 3px var(--c);animation:blink 1.4s infinite alternate}
.lights i:before{content:"";position:absolute;top:-4px;left:2px;width:5px;height:5px;background:#3d4a33;border-radius:1px}
@keyframes blink{0%{opacity:.35;box-shadow:0 0 2px 0 var(--c)}100%{opacity:1}}
body.kidmode .lights{display:flex}
body.kidmode .wrap{padding-top:calc(30px + env(safe-area-inset-top))}
.hero{position:relative;height:120px;margin:4px 0 -6px}
.hero .hbg{position:absolute;inset:-14px -16px 0;width:calc(100% + 32px);height:calc(100% + 14px);object-fit:cover;border-radius:0 0 30px 30px;-webkit-mask-image:linear-gradient(180deg,#000 60%,transparent);mask-image:linear-gradient(180deg,#000 60%,transparent)}
.santa{position:absolute;left:50%;top:6px;font-size:84px;line-height:1;transform-origin:50% 90%;animation:wave 2.2s ease-in-out infinite;margin-left:-42px;filter:drop-shadow(0 10px 18px rgba(0,0,0,.5))}
@keyframes wave{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) translateY(-4px)}}
.tree{position:absolute;bottom:0;font-size:54px;filter:drop-shadow(0 0 14px rgba(255,220,120,.35));animation:twinkle 2.6s ease-in-out infinite}
.tree.t1{left:12%}.tree.t2{right:12%;animation-delay:1.3s;font-size:46px}
@keyframes twinkle{50%{filter:drop-shadow(0 0 22px rgba(255,220,120,.8));transform:scale(1.04)}}
.elves{display:flex;justify-content:center;align-items:flex-end;gap:18px;margin-top:22px;height:130px}
.elf{font-size:46px;line-height:1;display:inline-block;animation:hop 1.6s ease-in-out infinite}
.elf img{height:118px;width:auto;display:block;filter:drop-shadow(0 8px 14px rgba(0,0,0,.5))}
.elf.e2{animation-delay:.4s;transform:scaleX(-1)}.elf.e3{animation-delay:.8s}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px) rotate(-6deg)}60%{transform:translateY(-10px) rotate(5deg)}}
.elf.e2{animation-name:hop2}@keyframes hop2{0%,100%{transform:scaleX(-1)}40%{transform:scaleX(-1) translateY(-14px) rotate(-6deg)}}
.elf.peek{position:fixed;right:-6px;bottom:calc(10px + env(safe-area-inset-bottom));font-size:58px;z-index:5;animation:peek 7s ease-in-out infinite}
.elf.peek img{height:110px}
@keyframes peek{0%,60%,100%{transform:translateX(90px) rotate(10deg)}70%,90%{transform:translateX(0) rotate(-8deg)}80%{transform:translateX(4px) rotate(4deg)}}
.elf.wr{position:absolute;right:-8px;top:-34px;font-size:44px;z-index:3;animation:hop 2s ease-in-out infinite}
.elf.wr img{height:80px}
/* trineo volando */
.fsl{position:fixed;left:0;z-index:45;pointer-events:none;animation:sfly 9s linear forwards;width:250px}
.fsl.big{width:340px}
@keyframes sfly{0%{transform:translateX(calc(100vw + 40px)) translateY(0)}25%{transform:translateX(calc(75vw - 60px)) translateY(-18px)}50%{transform:translateX(calc(50vw - 110px)) translateY(6px)}75%{transform:translateX(calc(25vw - 170px)) translateY(-14px)}100%{transform:translateX(-340px) translateY(0)}}
.sleigh{display:flex;align-items:flex-end;gap:2px;font-size:38px;line-height:1;filter:drop-shadow(0 0 12px rgba(255,220,140,.45))}
.fsl.big .sleigh{font-size:52px}
.sleigh img{width:100%;height:auto;display:block}
.sleigh .rd{animation:gal .5s ease-in-out infinite alternate}.sleigh .r2{animation-delay:.15s}.sleigh .r3{animation-delay:.3s}
@keyframes gal{to{transform:translateY(-6px) rotate(-4deg)}}
.sleigh .sd{position:relative;font-size:1.25em;margin-left:4px}
.sleigh .sd i{position:absolute;left:18%;top:-.55em;font-style:normal;font-size:.62em}
.sleigh .sd b{position:absolute;right:4%;top:-.45em;font-size:.45em}
.fsl .dust{position:absolute;right:-6px;top:60%;width:6px;height:6px;border-radius:50%;background:#ffe9a8;box-shadow:0 0 8px 3px rgba(255,220,140,.8);animation:dust 1.6s ease-out infinite}
@keyframes dust{0%{transform:translate(0,0);opacity:1}100%{transform:translate(60px,26px) scale(.2);opacity:0}}
.sky .sl{width:auto;height:auto;background:none;box-shadow:none;border-radius:0;transform:translate(-50%,-60%)}
.sleigh.mini{font-size:20px}
/* tarjetas de colores */
body.kidmode .tile{border:1px solid rgba(255,255,255,.08);box-shadow:0 10px 26px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.12)}
body.kidmode .tile[data-g=mail]{background:linear-gradient(135deg,#b3263a,#7a1422 60%,#4a0b15)}
body.kidmode .tile[data-g=write]{background:linear-gradient(135deg,#1f7a52,#0e4a31 60%,#072a1c)}
body.kidmode .tile[data-g=list]{background:linear-gradient(135deg,#c79a3c,#8a6420 60%,#4d3610)}
body.kidmode .tile[data-g=pass]{background:linear-gradient(135deg,#2a6f8f,#164a63 60%,#0b2a3a)}
body.kidmode .tile[data-g=track]{background:linear-gradient(135deg,#3b3d8f,#1f2260 60%,#10122f)}
body.kidmode .tile .tt{color:#fff6e0;text-shadow:0 2px 6px rgba(0,0,0,.4)}
body.kidmode .tile .ts{color:rgba(255,240,220,.8)}
body.kidmode .tile .ic{font-size:46px;animation:bob 2.4s ease-in-out infinite}
body.kidmode .tile:nth-child(2) .ic{animation-delay:.4s}body.kidmode .tile:nth-child(3) .ic{animation-delay:.8s}body.kidmode .tile:nth-child(4) .ic{animation-delay:1.2s}body.kidmode .tile:nth-child(5) .ic{animation-delay:1.6s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(-5deg)}}
body.kidmode .tile.hl{animation:glow 1.5s ease-in-out infinite alternate}
@keyframes glow{to{box-shadow:0 0 0 3px #ffd54a,0 0 30px rgba(255,213,74,.6)}}
body.kidmode .kid{background:linear-gradient(160deg,#2a1712,#160d0a);border-color:#5a3a20}
body.kidmode .av{border-color:#ffd54a;animation:bob 3s ease-in-out infinite}
body.kidmode .cd div{background:linear-gradient(180deg,#8e1c2a,#5a0f19);border-color:#c9a868}
body.kidmode .cd b{color:#fff3d6}
body.kidmode .cd small{color:#ffd9a0}
body.kidmode .btn.gold,body.kidmode .btn.redb{animation:pulse2 2.2s ease-in-out infinite}
@keyframes pulse2{50%{transform:scale(1.015)}}
.hero.img{height:210px;margin-bottom:0}

.advg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px;perspective:800px}
.door{position:relative;aspect-ratio:1/1.12;border-radius:14px;border:2px solid rgba(255,230,170,.55);background:var(--c);background:linear-gradient(145deg,var(--c),color-mix(in srgb,var(--c) 55%,#000));color:#fff6e0;cursor:pointer;box-shadow:0 8px 18px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.25);transform-origin:left center;transition:transform .55s ease}
.door b{font-family:ODSerif,serif;font-weight:400;font-size:30px;text-shadow:0 2px 6px rgba(0,0,0,.45)}
.door i{position:absolute;right:5px;bottom:4px;font-style:normal;font-size:15px}
.door:after{content:"";position:absolute;inset:5px;border:1px dashed rgba(255,240,200,.35);border-radius:10px}
.door.lk{filter:saturate(.45) brightness(.6)}
.door.op{background:linear-gradient(145deg,#f4e9d0,#d8c294);color:#5a1414;border-color:#c9a868}
.door.td{animation:glow 1.2s ease-in-out infinite alternate}
.door.flip{transform:rotateY(-100deg)}
.advc{text-align:center;padding:6px 4px 4px}
.advi{font-size:72px;line-height:1;animation:bob 2.4s ease-in-out infinite}
.advk{margin-top:12px;font-size:11px;letter-spacing:.2em;color:var(--g);text-transform:uppercase}
.advt{font-family:ODSerif,serif;font-size:24px;line-height:1.35;color:var(--gl);margin-top:8px}
.treats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.treat{border:2px solid var(--line);border-radius:18px;background:#160f0c;padding:16px 8px;color:var(--gl);font-family:ODSerif,serif;font-size:18px;cursor:pointer}
.treat span{display:block;font-size:46px;margin-bottom:6px}
.treat.on{border-color:#ffd54a;background:linear-gradient(160deg,#3a2414,#1e120c);box-shadow:0 0 22px rgba(255,213,74,.35)}
body.kidmode .tile[data-g=adv]{background:linear-gradient(135deg,#1f7a52,#b3263a)}
body.kidmode .tile[data-g=eve]{background:linear-gradient(135deg,#c76a2a,#7a3414)}
.cf{position:fixed;top:-12px;width:8px;height:12px;border-radius:2px;z-index:70;pointer-events:none;animation:cff 3s ease-in forwards}
@keyframes cff{to{transform:translate(var(--x),105vh) rotate(var(--r))}}
.sky .sleigh.mini{width:120px}
.sleigh img{filter:drop-shadow(0 0 10px rgba(255,220,140,.5))}
.fsl .dust{right:8px;top:70%}
