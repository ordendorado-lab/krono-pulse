:root{--bg:#0b0a08;--card:#15120d;--card2:#1c1810;--line:#3a3124;--gold:#c9a868;--gold2:#ecdcae;--txt:#f1e8d4;--soft:#a89a80;--ok:#9be3a8;--bad:#f0a0a0;--warn:#f2c46b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:400 16px/1.45 ODSans,system-ui,sans-serif}
body{min-height:100vh;background:radial-gradient(120% 60% at 50% -10%,#2a2115 0%,#0b0a08 60%) fixed}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(120px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.k{letter-spacing:.42em;font-size:11px;color:var(--gold)}
h1{font:400 34px ODSerif,serif;color:var(--gold2);margin:2px 0 0;line-height:1.1}
h1 i{font-family:ODScript,serif;font-style:normal;color:var(--gold);font-size:40px}
h2{font:400 26px ODSerif,serif;color:var(--gold2);margin:0 0 10px}
.ib{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:rgba(23,20,15,.9);color:var(--gold2);font-size:20px;cursor:pointer}
.tot{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.tot button{border:1px solid var(--line);background:linear-gradient(160deg,#1f1a11,#100d09);border-radius:18px;padding:14px 12px;text-align:left;cursor:pointer}
.tot button.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset,0 10px 30px rgba(201,168,104,.12)}
.tot small{display:block;font-size:11px;letter-spacing:.18em;color:var(--soft);text-transform:uppercase}
.tot b{display:block;font:400 28px ODSerif,serif;color:var(--gold2);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tot em{font-style:normal;font-size:12px;color:var(--soft)}
.today{border:1px solid var(--gold);border-radius:18px;padding:12px;background:linear-gradient(160deg,#2a2114,#120f0a);margin-bottom:14px}
.today h3{margin:0 0 6px;font:500 13px ODSans;letter-spacing:.16em;color:var(--gold);text-transform:uppercase}
.list{display:flex;flex-direction:column;gap:8px}
.it{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:12px;cursor:pointer;text-align:left;width:100%}
.av{flex:0 0 44px;height:44px;border-radius:50%;display:grid;place-items:center;font:500 17px ODSans;color:#1a140a;background:linear-gradient(135deg,#f6e4b0,#c9a868 55%,#9a7a3c)}
.it .mid{flex:1;min-width:0}.it .nm{font-weight:500;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .sub{font-size:13px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .am{font:400 21px ODSerif,serif;color:var(--gold2);text-align:right;white-space:nowrap}
.pill{display:inline-block;font-size:11.5px;border-radius:20px;padding:2px 8px;margin-top:3px;border:1px solid var(--line);color:var(--soft)}
.pill.ok{color:var(--ok);border-color:#2f5e3a}.pill.bad{color:var(--bad);border-color:#5e2f2f}.pill.warn{color:var(--warn);border-color:#5e4c2f}.pill.gold{color:#1a140a;background:var(--gold);border-color:var(--gold)}
.empty{text-align:center;color:var(--soft);padding:26px 10px;border:1px dashed var(--line);border-radius:16px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));width:min(528px,calc(100% - 32px));border:0;border-radius:18px;padding:18px;font:600 18px ODSans;color:#140f07;background:linear-gradient(135deg,#8c6d33,#ecdcae 45%,#c9a868 70%,#8c6d33);box-shadow:0 14px 40px rgba(0,0,0,.6);cursor:pointer;z-index:5}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font:600 16px ODSans;cursor:pointer;text-align:center;text-decoration:none;margin-top:10px}
.gg{background:linear-gradient(135deg,#f6e4b0,#c9a868 50%,#a9853f);color:#1a140c}
.gh{background:transparent;border:1px solid var(--line);color:var(--gold2)}
.wa{background:linear-gradient(135deg,#1fa855,#25d366);color:#fff}
.dz{background:transparent;border:1px solid #5e2f2f;color:var(--bad)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row2 .btn{margin-top:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}.seg.s3{grid-template-columns:1fr 1fr 1fr}
.seg button{border:1px solid var(--line);background:#0f0d0a;border-radius:14px;padding:14px 6px;font:500 15px ODSans;cursor:pointer;color:var(--txt)}
.seg button.on{border-color:var(--gold);background:#2a2216;color:var(--gold2);box-shadow:inset 0 0 0 1px var(--gold)}
label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:14px 0 6px}
input,select,textarea{width:100%;background:#0b0a08;border:1px solid var(--line);border-radius:12px;padding:13px;font-size:16px;outline:none;color:var(--txt)}
input:focus,textarea:focus,select:focus{border-color:var(--gold)}
textarea{min-height:90px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chips button{border:1px solid var(--line);background:#0f0d0a;border-radius:20px;padding:8px 12px;font-size:14px;cursor:pointer;color:var(--txt)}.chips button.on{border-color:var(--gold);color:var(--gold2);background:#2a2216}
.hint{font-size:13px;color:var(--soft);margin-top:6px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet.on{display:flex}
.sh{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:#14110c;border:1px solid var(--line);border-radius:24px 24px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.shh{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}.shh h2{margin:0}
.x{background:#1e1a13;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:7px 12px;cursor:pointer}
.big{font:400 44px ODSerif,serif;color:var(--gold2);text-align:center;margin:8px 0 2px}
.bar{height:8px;background:#2a241b;border-radius:8px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#8c6d33,#ecdcae)}
.box{border:1px solid var(--line);border-radius:16px;padding:12px;background:var(--card);margin-top:12px}
.box.gold{border-color:var(--gold);background:linear-gradient(160deg,#2a2114,#120f0a)}
.hist{font-size:13px;color:var(--soft)}.hist div{padding:6px 0;border-top:1px dashed #2c261c}.hist div:first-child{border-top:0}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-20px);background:var(--gold);color:#1a140a;padding:11px 18px;border-radius:999px;font:500 15px ODSans;opacity:0;transition:.3s;pointer-events:none;z-index:60;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50;display:none}
.lock{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.dots{display:flex;gap:14px;margin:22px 0}.dots i{width:16px;height:16px;border-radius:50%;border:1px solid var(--gold)}.dots i.on{background:var(--gold)}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px}.pad button{height:76px;border-radius:50%;border:1px solid var(--line);background:#14110c;font:400 28px ODSerif;color:var(--gold2);cursor:pointer}
.pad button:active{background:#2a2216}
.shake{animation:sh .4s}@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.logo{width:96px;height:96px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);box-shadow:0 10px 40px rgba(201,168,104,.25);display:block;margin:0 auto}
.logoi{width:96px;height:96px;border-radius:50%;margin:0 auto;display:grid;place-items:center;font:400 40px ODSerif;color:#1a140a;background:linear-gradient(135deg,#f6e4b0,#c9a868 55%,#9a7a3c);border:2px solid var(--gold)}
.portal{text-align:center;padding-top:10px}
.portal .who{font:400 28px ODSerif,serif;color:var(--gold2);margin-top:14px}
.portal .msg{color:var(--soft);margin-top:4px}
.cp{transition:transform .15s}.cp.flash{transform:scale(.96);box-shadow:0 0 0 2px var(--ok)}
.cp small{display:block;font:400 12px ODSans;opacity:.85;margin-top:3px;word-break:break-all}
.ft{text-align:center;font-size:11px;letter-spacing:.3em;color:var(--gold);margin-top:26px}
.ft a{color:var(--gold);text-decoration:none}
.shot{max-width:140px;max-height:180px;border-radius:10px;border:1px solid var(--gold);display:block;margin:10px auto 0}
.demo{font-size:12px;color:var(--warn);text-align:center;margin-top:8px}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid #2a241b}.set:first-child{border-top:0}
.sw{position:relative;width:52px;height:30px;flex:0 0 52px}.sw input{opacity:0;width:0;height:0}.sw span{position:absolute;inset:0;border-radius:30px;background:#2a241b;border:1px solid var(--line);transition:.2s}.sw span:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;border-radius:50%;background:var(--soft);transition:.2s}.sw input:checked+span{background:#5a4620;border-color:var(--gold)}.sw input:checked+span:before{transform:translateX(22px);background:var(--gold2)}

</style>
</head>

<div id="app"></div>
<div id="sheet" class="sheet"><div class="sh" id="shb"></div></div>
<div id="toast" class="toast"></div>
