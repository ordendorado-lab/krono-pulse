:root{--bg:#0e0c0a;--card:#17140f;--gold:#c9a868;--gold2:#e9d7a8;--line:#3a3124;--txt:#efe6d2;--soft:#a89a80}
button{font-family:inherit}
.btn{white-space:nowrap}@media(max-width:420px){.lg{display:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:ODSans,system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 120px}
header{text-align:center;padding:6px 46px 14px}
header .k{font-size:11px;letter-spacing:.35em;color:var(--gold)}
header h1{font-family:ODSerif,serif;font-weight:500;font-size:34px;margin:4px 0 0;color:var(--gold2)}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:4px 0 12px}
.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid var(--line);background:var(--card);color:var(--soft);padding:7px 2px 6px;border-radius:12px;font-size:clamp(8.5px,2.75vw,10.5px);overflow-wrap:anywhere;hyphens:auto;text-align:center;line-height:1.15;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:54px;justify-content:center}.tab i{font-style:normal;font-size:19px;line-height:1}
.tab.on{border-color:var(--gold);color:var(--bg);background:linear-gradient(135deg,#b08d4a,#e9d7a8,#b08d4a);font-weight:500}
#mini{position:fixed;top:8px;right:8px;width:min(38vw,170px);z-index:60;border-radius:10px;overflow:hidden;border:1.5px solid #c9a868;box-shadow:0 8px 28px rgba(0,0,0,.75);opacity:0;transform:scale(.9);transform-origin:top right;pointer-events:none;transition:opacity .18s,transform .18s}#mini.on{opacity:1;transform:scale(1)}#mini canvas{display:block;width:100%;height:auto}
.prev{position:relative;border-radius:14px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.6);border:1px solid var(--line)}
canvas{width:100%;height:auto;display:block}
.form{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
label{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:12px 0 6px}
label:first-child{margin-top:0}
input,textarea{width:100%;background:#0b0a08;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:12px;font:16px ODSans,sans-serif;outline:none}
input:focus,textarea:focus{border-color:var(--gold)}
textarea{resize:vertical;min-height:70px}
.row{display:flex;gap:10px}.row>div{flex:1}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%);display:flex;gap:10px;justify-content:center}
.btn{flex:1;max-width:270px;border:0;border-radius:14px;padding:15px 10px;font:500 15px ODSans,sans-serif;cursor:pointer}
.btn.wa{background:#1fa855;color:#fff}
.btn.dl{background:linear-gradient(135deg,#b08d4a,#e9d7a8,#b08d4a);color:#1a140a}
.unlock{margin-top:16px;background:var(--card);border:1px dashed var(--gold);border-radius:14px;padding:14px;text-align:center}
.unlock p{margin:0 0 10px;font-size:13px;color:var(--soft)}
.unlock .row input{text-transform:uppercase;letter-spacing:.2em;text-align:center}
.unlock button{border:0;border-radius:10px;padding:0 18px;background:var(--gold);color:#1a140a;font:500 14px ODSans}
.ok{color:#9be3a8;font-size:13px}
.opts{display:flex;gap:6px;flex-wrap:wrap}.opt{flex:1;border:1px solid var(--line);background:#0f0d0a;color:var(--soft);padding:10px 6px;border-radius:10px;font-size:13px;cursor:pointer;white-space:nowrap}.opt.on{border-color:var(--gold);color:var(--gold2);background:#221c12}
.sw{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:13px;color:var(--txt);cursor:pointer}.sw input{width:22px;height:22px;accent-color:#c9a868;flex:0 0 auto}
.lnk{background:none!important;border:0;color:var(--gold2)!important;text-decoration:underline;font-size:13px!important;padding:6px!important;margin-top:6px;flex:0 0 auto!important}
.photo{font-size:13px;color:var(--soft)}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--gold);color:#1a140a;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
footer{text-align:center;font-size:11px;letter-spacing:.3em;color:var(--gold);margin-top:22px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;z-index:10}
.ov.show{display:flex}.ov img{max-width:100%;max-height:68vh;border-radius:10px;border:1px solid var(--gold)}
.ov p{color:var(--gold2);text-align:center;font-size:15px;margin:14px 0}.ov .row{gap:10px;width:100%;max-width:420px}
.ov a,.ov button{flex:1;text-align:center;text-decoration:none;border:0;border-radius:12px;padding:13px;font:500 15px ODSans,sans-serif}
.ov a{background:linear-gradient(135deg,#b08d4a,#e9d7a8,#b08d4a);color:#1a140a}.ov button{background:#2a241b;color:var(--txt)}
.prev{position:sticky;top:0;z-index:3;background:var(--bg);border:0;box-shadow:none;border-radius:0;padding:6px 0}
.prev canvas{max-height:44vh;width:auto;max-width:100%;margin:0 auto;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.6);border:1px solid var(--line)}
@media(max-width:360px){.tab{font-size:9.5px}.tab i{font-size:17px}}
@media(min-width:900px){.wrap{max-width:1100px;display:grid;grid-template-columns:1fr 440px;column-gap:36px;align-items:start}
 header,.tabs{grid-column:1/-1}.prev{grid-row:3/7;grid-column:1;top:20px}.prev canvas{max-height:calc(100vh - 140px)}
 .unlock,.form,footer{grid-column:2}.unlock{margin-top:0}.bar{left:auto;right:calc(50% - 550px);width:440px;padding-left:0;padding-right:0;background:none}}
.bar{flex-wrap:wrap}.btn.vid{flex-basis:100%;max-width:550px;background:linear-gradient(135deg,#8c6d33,#e9d7a8 45%,#c9a868 70%,#8c6d33);color:#140f07;font-weight:600}
.wrap{padding-bottom:200px}.bar{z-index:6}
.snd{position:fixed;top:12px;right:12px;z-index:8;width:46px;height:46px;border-radius:50%;border:1px solid var(--gold);background:rgba(23,20,15,.9);color:var(--gold2);font-size:20px;cursor:pointer}
.prog{width:100%;max-width:420px;height:8px;background:#2a241b;border-radius:8px;overflow:hidden;margin:10px 0}.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8c6d33,#e9d7a8)}
.ov video{max-width:100%;max-height:62vh;border-radius:10px;border:1px solid var(--gold)}
@media(min-width:900px){.bar{right:calc(50% - 550px)}.btn.vid{max-width:none}}
.inst{margin-top:8px;border:1px solid #c9a868;background:rgba(23,20,15,.92);color:#e9d7a8;border-radius:999px;padding:8px 12px;font:500 12px Poppins,sans-serif;cursor:pointer}
#instOv{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.72);display:none;align-items:flex-end;justify-content:center}#instOv.on{display:flex}
